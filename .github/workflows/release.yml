name: Release

# Builda gli installer per macOS/Windows/Linux e li pubblica sulla Release al tag v*.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # per pubblicare gli asset sulla Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install pulito → con node-linker=hoisted (.npmrc) electron-builder trova
      # un node_modules flat da impacchettare e ricompilare per l'ABI di Electron.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Bundle del daemon + electron-builder (targeta l'OS host) → pubblica sulla Release.
      # Su macOS senza certificato disabilitiamo esplicitamente la firma
      # (-c.mac.identity=null): altrimenti electron-builder tenta un ad-hoc sign
      # sul runner e fallisce con "apps/ui not a file". Con MAC_CSC_LINK impostato
      # in futuro la firma avviene normalmente — nessun cambio di codice.
      - name: Build & publish installer
        shell: bash
        run: |
          pnpm --filter @openmate/ui bundle:daemon
          # whisper-server per la trascrizione locale della voce (universale su macOS:
          # lo stesso runner produce il DMG arm64 e quello x64)
          if [ "$RUNNER_OS" = "macOS" ]; then export CMAKE_OSX_ARCHITECTURES="arm64;x86_64"; fi
          packaging/build-whisper.sh
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$MAC_CSC_LINK" ]; then
            EXTRA="-c.mac.identity=null"
          fi
          pnpm --filter @openmate/ui exec electron-builder --publish always $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Firma macOS (opzionali: assenti → build non firmata) ---
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Firma Windows (opzionali) ---
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  # Allega alla Release lo zip dell'estensione Chrome (da caricare non pacchettizzata).
  extension:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip estensione
        run: |
          mkdir -p "Remi Browser Extension"
          cp apps/extension/manifest.json apps/extension/background.js "Remi Browser Extension"/
          zip -r remi-chrome-extension.zip "Remi Browser Extension"
      - name: Carica sulla Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/ui/package.json').version")
          gh release upload "v$VERSION" remi-chrome-extension.zip --repo "${{ github.repository }}" --clobber
