<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

      <div class="card">
        <div class="k">Task ricorrenti</div>
        <div class="v" id="schedCount">—</div>
        <div class="s">attivi</div>
      </div>
      <div class="card">
        <div class="k">Controllo schermo</div>
        <div class="v" id="cu">—</div>
        <div class="s">computer-use</div>
      </div>

    <section>
      <h2>Task ricorrenti</h2>
      <div id="schedList" class="list"><div class="empty">Nessun task ricorrente.</div></div>
    </section>

    <section>
      <h2>Attività recente</h2>
