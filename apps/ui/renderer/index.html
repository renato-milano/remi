<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="robot-right">
    <div id="bubble" class="bubble hidden interactive"><div id="bubbleContent"></div></div>
    <div id="approval" class="approval hidden interactive"></div>

    <div id="activity" class="activity hidden interactive">
      <div class="activity-head">Attività <button id="activityClose" class="no-drag">✕</button></div>
      <div id="activityBody" class="activity-body"></div>
    </div>

    <div id="chat" class="chat hidden interactive">
      <div class="chat-head"><span>Chat</span><button id="chatClose" class="no-drag">✕</button></div>
      <div id="chatLog" class="chat-log"></div>
      <div class="chat-foot"><input id="chatInput" class="no-drag" type="text" placeholder="scrivi…" /></div>
    </div>

    <div id="cuBanner" class="cu-banner hidden">🖥️ controllo schermo attivo</div>

    <div id="stage" class="stage interactive"></div>

    <div id="dock" class="dock interactive">
      <input id="input" class="no-drag" type="text" placeholder="scrivi a Remi…" />
      <span id="status" class="status">●</span>
    </div>
  </div>

  <!-- Per abilitare Rive: aggiungi @rive-app/canvas e scommenta:
  <script src="../node_modules/@rive-app/canvas/rive.js"></script>
  -->
  <script src="character.js"></script>
  <script src="character-rive.js"></script>
  <script src="app.js"></script>
</body>
</html>
