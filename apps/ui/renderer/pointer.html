<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="pointer.css" />
</head>
<body>
  <canvas id="trail" class="trail"></canvas>
  <div id="layer"></div>
  <!-- cerchi a mano sullo schermo, legati ai passi del pannello -->
  <svg id="marks" class="marks"></svg>
  <div id="anchor" class="anchor hidden"></div>
  <div id="ask" class="ask hidden">
    <input id="askInput" type="text" placeholder="Chiedi a Remi di questo…" spellcheck="false" />
    <span class="ask-hint">↵ invia · esc annulla</span>
  </div>
  <div id="card" class="card hidden">
    <button id="cardClose" class="card-close" title="Chiudi">✕</button>
    <div id="cardStatus" class="card-status"></div>
    <div id="cardBody" class="card-body"></div>
  </div>
  <div id="panel" class="panel hidden">
    <button id="panelClose" class="card-close" title="Chiudi">✕</button>
    <h2 id="panelTitle" class="panel-title"></h2>
    <svg id="panelSvg" class="panel-svg" viewBox="0 0 600 380">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f2a24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <!-- punte delle frecce nei colori dei passi -->
        <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4a78c2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c99a2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c9584a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3f9a66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <marker id="arrow-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8c8a80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7a5cc2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
        <!-- tratto "a mano": leggera irregolarità sulle linee -->
        <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" />
          <feDisplacementMap in="SourceGraphic" scale="2.2" />
        </filter>
      </defs>
      <g id="panelDraw" filter="url(#rough)"></g>
      <!-- numeri dei passi accanto al loro gruppo (fuori dal filtro: restano netti) -->
      <g id="panelBadges"></g>
    </svg>
  </div>
  <!-- il mouse di Remi: disegna i tratti del pannello e i segni sullo schermo (la punta è il punto 0,0) -->
  <div id="remiCursor" class="remi-cursor" aria-hidden="true">
    <svg width="30" height="34" viewBox="-4 -4 30 34">
      <defs>
        <linearGradient id="remiCursorInk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a49f5" />
          <stop offset=".45" stop-color="#2a5ef4" />
          <stop offset="1" stop-color="#86a2f6" />
        </linearGradient>
      </defs>
      <path d="M0 0 L0 24.5 L7.4 17.3 L17.6 17 Z" fill="url(#remiCursorInk)" stroke="url(#remiCursorInk)" stroke-width="2.6" stroke-linejoin="round" />
    </svg>
  </div>
  <script src="pointer.js"></script>
</body>
</html>
