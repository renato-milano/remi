packages:
  - packages/*
  - apps/*

# Build script approvati (esbuild serve a tsup/vitest/tsx; biome per lint/format).
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  better-sqlite3: true
  electron: true
  '@nut-tree-fork/libnut': true
  uiohook-napi: false # ha le prebuild N-API per mac/win/linux: niente compilazione

# Versioni centralizzate delle dev-dependency condivise (pnpm catalog).
# I package le referenziano con "catalog:".
catalog:
  typescript: ^5.6.3
  tsup: ^8.3.0
  vitest: ^2.1.9
  tsx: ^4.19.2
  "@types/node": ^22.10.0
  zod: ^3.23.8
  ai: ^5.0.0
  "@ai-sdk/anthropic": ^2.0.0
  "@ai-sdk/openai": ^2.0.0
  "@ai-sdk/openai-compatible": ^1.0.0
